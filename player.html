<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Music Player</title>
<style>
  body { font-family: sans-serif; text-align: center; padding: 50px; background: #f0f0f0; }
  #player { background: white; padding: 20px; border-radius: 10px; display: inline-block; box-shadow: 0 0 10px rgba(0,0,0,0.2);}
  button { margin: 5px; padding: 10px 15px; border: none; border-radius: 5px; background: #4CAF50; color: white; cursor: pointer;}
  button:disabled { background: gray; cursor: not-allowed;}
  input[type=range] { width: 300px; }
</style>
</head>
<body>

<div id="player">
  <h2 id="song-title">Song 1</h2>
  <audio id="audio" src="song1.mp3"></audio>
  <div>
    <button id="prev">قبلی</button>
    <button id="play">▶ پخش</button>
    <button id="next">بعدی</button>
  </div>
  <div>
    <input type="range" id="progress" value="0" min="0" max="100">
  </div>
  <div>
    حجم: <input type="range" id="volume" min="0" max="1" step="0.01" value="0.5">
  </div>
</div>

<script>
const songs = ["song1.mp3", "song2.mp3", "song3.mp3"];
let current = 0;

const audio = document.getElementById("audio");
const playBtn = document.getElementById("play");
const prevBtn = document.getElementById("prev");
const nextBtn = document.getElementById("next");
const progress = document.getElementById("progress");
const volume = document.getElementById("volume");
const title = document.getElementById("song-title");

function loadSong(index) {
  audio.src = songs[index];
  title.textContent = "Song " + (index+1);
  audio.load();
}

playBtn.addEventListener("click", () => {
  if(audio.paused){
    audio.play();
    playBtn.textContent = "⏸ توقف";
  } else {
    audio.pause();
    playBtn.textContent = "▶ پخش";
  }
});

prevBtn.addEventListener("click", () => {
  current = (current - 1 + songs.length) % songs.length;
  loadSong(current);
  audio.play();
  playBtn.textContent = "⏸ توقف";
});

nextBtn.addEventListener("click", () => {
  current = (current + 1) % songs.length;
  loadSong(current);
  audio.play();
  playBtn.textContent = "⏸ توقف";
});

audio.addEventListener("timeupdate", () => {
  const percent = (audio.currentTime / audio.duration) * 100;
  progress.value = percent || 0;
});

progress.addEventListener("input", () => {
  audio.currentTime = (progress.value / 100) * audio.duration;
});

volume.addEventListener("input", () => {
  audio.volume = volume.value;
});

// Load first song
loadSong(current);
</script>

</body>
</html>
